### ================================================================
### GLM-OCR Fine-Tuning Config (LLaMA-Factory)
### Hardware: RTX 4080 Super (16GB VRAM)
### Target deployment: 4GB VRAM (via GGUF Q4_K_M after export)
### ================================================================

### Model
model_name_or_path: zai-org/GLM-OCR
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA Config
# rank=32 safe for 16GB VRAM, gives better capacity than rank=16
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all  # inject to all linear layers (q,k,v,o,gate,up,down)

### Dataset
dataset: invoice_kie
dataset_dir: data
template: glm4v   # REQUIRED: GLM-4V/GLM-OCR chat template
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 4

### Training Output
output_dir: saves/glm-ocr-invoice-lora
logging_dir: saves/glm-ocr-invoice-lora/logs
logging_steps: 10
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### Training Hyperparameters
# RTX 4080 Super: no quantization needed during training (FP16 fits in 16GB)
per_device_train_batch_size: 4
gradient_accumulation_steps: 2   # effective batch = 8
learning_rate: 1.0e-4
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true                        # RTX 4080 Super supports bf16
gradient_checkpointing: true      # saves VRAM at cost of ~20% speed

### Evaluation
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50
load_best_model_at_end: true
metric_for_best_model: eval_loss
